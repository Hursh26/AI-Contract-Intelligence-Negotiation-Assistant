name: CI

# Runs on every PR into develop or main, and on pushes to those branches.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform proof: the same test suite runs on all three OSes
        # the team actually develops on (Mac + Windows) plus the OS
        # production most likely deploys to (Linux). Tests use an isolated
        # SQLite DB + temp storage dir (see backend/tests/conftest.py), so
        # no external services are needed on any runner.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

