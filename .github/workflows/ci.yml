# green is what "required status checks" in branch protection checks against.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  placeholder-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

